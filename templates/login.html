{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card baby-card p-4">
            <h3 class="text-center mb-3">Ворид шудан ба Babyland</h3>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Номи корбар</label>
                    <input type="text" name="username" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Рамз</label>
                    <input type="password" name="password" class="form-control" required>
                </div>

                <button class="btn baby-btn w-100">Ворид шудан</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
