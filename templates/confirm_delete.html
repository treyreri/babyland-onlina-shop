{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card baby-card p-4 text-center">
            <h3>{{ title }}</h3>
            <p>Шумо мутмаин ҳастед, ки ин амалро иҷро мекунед?</p>
            <p><strong>{{ object_name }}</strong></p>

            <form method="post">
                {% csrf_token %}
                <button class="btn btn-danger">Ҳа, тасдиқ мекунам</button>
                <a href="{{ cancel_url }}" class="btn btn-outline-secondary">Бекор кардан</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
